# cp_playernotes main configuration
# Extended settings will be added in future releases.

debug: false

storage:
  type: sqlite # sqlite, mysql

  sqlite:
    file: "playernotes.db"

  mysql:
    host: "localhost"
    port: 3306
    database: "playernotes"
    username: "root"
    password: ""
    use-ssl: false
    pool:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

hooks:
  placeholderapi: true

join-alerts:
  enabled: true
  minimum-priority: HIGH
  permission: "playernotes.notify"

discord:
  enabled: false
  webhook-url: ""
  username: "PlayerNotes Pro"
  avatar-url: ""
  debug-payload: false
  notify:
    note-created: true
    critical-note-created: true
    note-archived: true
    note-deleted: true
    flagged-player-join: true
