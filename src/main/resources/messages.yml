# PlayerNotes Pro — chat messages
# Uses MiniMessage formatting: https://docs.advntr.dev/minimessage/format.html
# Placeholders: <player>, <id>, <count>, etc. — see each message key

# Prefix prepended to most command feedback (referenced as <prefix> in messages)
prefix: "<gray>[</gray><aqua>PlayerNotes</aqua><gray>]</gray> "

command:
  usage: "<prefix><gray>Usage:</gray> <white>/pn <player|add|list|archive|remove|version|reload|debug|discordtest></white>"
  unknown: "<prefix><red>Unknown subcommand.</red> <gray>Try</gray> <white>/pn version</white>"
  no-permission: "<prefix><red>You do not have permission to do that.</red>"
  error: "<prefix><red>Something went wrong. Check the console for details.</red>"
  database-error: "<red>Something went wrong while updating notes. Check console.</red>"
  player-not-found: "<prefix><red>Player not found:</red> <white><player></white>"
  invalid-id: "<prefix><red>Invalid note id.</red> <gray>Use a positive number.</gray>"
  note-not-found: "<red>No note found with id #<id>.</red>"
  version: |
    <gray>Plugin:</gray> <white><plugin></white>
    <gray>Version:</gray> <white><version></white>
    <gray>Author:</gray> <white><author></white>
    <gray>Supported:</gray> <white><supported></white>
    <gray>Java:</gray> <white><java></white>
  reload-success: "<prefix><green>Configuration reloaded.</green>"
  reload-failure: "<prefix><red>Reload failed. Check the console for details.</red>"
  view-usage: "<prefix><gray>Usage:</gray> <white>/pn <player></white>"
  view-header: "<prefix><white><player></white> <gray>-</gray> <white><count></white> <gray>active note(s),</gray> <white><critical></white> <gray>critical</gray>"
  view-empty: "<prefix><gray>No active notes for</gray> <white><player></white><gray>.</gray>"
  list-usage: "<prefix><gray>Usage:</gray> <white>/pn list <player></white>"
  list-header: "<prefix><gray>Active notes for</gray> <white><player></white> <gray>(</gray><white><count></white><gray>)</gray>"
  list-empty: "<prefix><gray>No active notes for</gray> <white><player></white><gray>.</gray>"
  add-usage: "<prefix><gray>Usage:</gray> <white>/pn add <player> <note text></white>"
  add-success: "<green>✔ Note added for <white><player></white>.</green> <gray>ID: #<id></gray>"
  archive-usage: "<prefix><gray>Usage:</gray> <white>/pn archive <id></white>"
  archive-success: "<green>✔ Note #<id> archived.</green>"
  remove-usage: "<prefix><gray>Usage:</gray> <white>/pn remove <id></white>"
  remove-success: "<red>✔ Note #<id> permanently removed.</red>"
  # /pn debug output (playernotes.admin)
  debug: |
    <gold><bold>PlayerNotes Diagnostics</bold></gold>
    <gray>Plugin:</gray> <white><plugin> v<version></white>
    <gray>Server:</gray> <white><server></white>
    <gray>Java:</gray> <white><java></white>
    <gray>Storage:</gray> <white><storage></white>
    <gray>Database:</gray> <white><database></white>
    <gray>PlaceholderAPI:</gray> <white><placeholderapi></white>
    <gray>Discord:</gray> <white><discord></white>
    <gray>Join alerts:</gray> <white><join_alerts></white>
    <gray>GUI config:</gray> <white><gui_config></white>
    <gray>Messages config:</gray> <white><messages_config></white>
  debug-notes: "<gray>Total notes:</gray> <white><total></white> <dark_gray>|</dark_gray> <gray>Active notes:</gray> <white><active></white>"
  debug-unavailable: "unavailable"
  debug-yes: "yes"
  debug-no: "no"
  debug-enabled: "enabled"
  debug-disabled: "disabled"
  debug-database-connected: "connected"
  debug-database-failed: "failed"
  debug-discord-disabled: "disabled"
  debug-discord-enabled-configured: "enabled / configured"
  debug-discord-enabled-unconfigured: "enabled / not configured"
  # /pn discordtest feedback (playernotes.admin)
  discordtest-sending: "<gray>Sending Discord webhook test...</gray>"
  discordtest-success: "<green>✔ Discord webhook test sent successfully.</green>"
  discordtest-http-failure: "<red>Discord webhook failed with HTTP <status>.</red>"
  discordtest-error: "<red>Discord webhook test failed. Check console.</red>"

gui:
  console-no-gui: "<prefix><gray>Only players can open the notes GUI.</gray> <dark_gray>Use /pn list <player></dark_gray>"
  add-placeholder: "<prefix><gray>Chat input will be added in the next update.</gray>"
  pagination-placeholder: "<prefix><dark_gray>Pagination will be added in the next update.</dark_gray>"
  note-detail: "<prefix><white>Note #<id></white> <gray>for</gray> <aqua><player></aqua> <dark_gray>(<type> · <priority>)</dark_gray> <white><content></white> <dark_gray>— <date> by <staff></dark_gray>"

# Messages shown during GUI note creation (chat input after type/priority select)
chat-input:
  start: "<gray>Type your note in chat. Type <red>cancel</red> to cancel.</gray> <dark_gray>(<type> / <priority>)</dark_gray>"
  cancelled: "<red>Note creation cancelled.</red>"
  timeout: "<red>Note creation timed out.</red>"
  saved: "<green>✔ Note added for <white><player></white>.</green> <gray>ID: #<id></gray>"
  error: "<red>Something went wrong while saving the note. Check console.</red>"

# Staff notifications when a flagged player joins
join-alerts:
  staff-alert: "<red><bold>⚠ Staff Alert</bold></red> <gray><player> joined with <white><count></white> high-risk note(s).</gray>"
  staff-action: "<blue>Use /pn <player> to review notes.</blue>"
