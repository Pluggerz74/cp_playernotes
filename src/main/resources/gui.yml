  title: "<gradient:#ffffff:#60a5fa><bold>Select Type</bold></gradient> <dark_gray>·</dark_gray> <gray><player></gray>"
  size: 27

  slots:
    info: 10
    warning: 11
    suspect: 12
    punishment: 13
    staff: 14
    back: 16
    close: 22

  labels:
    option-name: "<white><bold><type></bold></white>"
    option-lore:
      - "<gray>Click to select this type</gray>"
    back-name: "<aqua><bold>Back</bold></aqua>"
    back-lore:
      - "<gray>Return to player notes</gray>"
    close-name: "<red><bold>Close</bold></red>"
    close-lore:
      - "<gray>Close this menu</gray>"

