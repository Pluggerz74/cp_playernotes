# PlayerNotes Pro — GUI configuration
# All titles and labels support MiniMessage formatting
# Placeholders: <player>, <id>, <type>, <priority>, <content>, <date>, <staff>, <count>

# Main player notes overview (54-slot inventory)
notes-menu:
  title: "<gradient:#ffffff:#60a5fa><bold>Player Notes</bold></gradient> <dark_gray>·</dark_gray> <gray><player></gray>"
  size: 54

  # Bukkit material names — invalid names fall back to defaults and log a config warning
  materials:
    border: WHITE_STAINED_GLASS_PANE
    background: LIGHT_GRAY_STAINED_GLASS_PANE
    accent: LIGHT_BLUE_STAINED_GLASS_PANE
    player-profile: PLAYER_HEAD
    stat-total: PAPER
    stat-critical: RED_DYE
    add-note: WRITABLE_BOOK
    note-default: PAPER
    note-warning: ORANGE_DYE
    note-critical: RED_DYE
    close: BARRIER
    previous: ARROW
    next: ARROW
    filter: HOPPER
    nav-disabled: GRAY_DYE

  # Inventory slot indices (0–53 for a 54-slot menu)
  slots:
    player-profile: 10
    total-notes: 12
    critical-notes: 14
    add-note: 16
    note-start: 28
    note-end: 34
    previous: 45
    filter: 48
    close: 49
    next: 53

  labels:
    player-profile-name: "<gradient:#60a5fa:#93c5fd><bold><player></bold></gradient>"
    player-profile-lore:
      - "<gray>Staff profile overview</gray>"
      - "<blue>View active notes below</blue>"
    total-name: "<white><bold>Total Notes</bold></white>"
    total-lore:
      - "<gray>Active notes for this player</gray>"
      - ""
      - "<aqua><count></aqua>"
    critical-name: "<red><bold>Critical Notes</bold></red>"
    critical-lore:
      - "<gray>High-risk staff flags</gray>"
      - ""
      - "<red><count></red>"
    add-name: "<gradient:#60a5fa:#93c5fd><bold>Add Note</bold></gradient>"
    add-lore:
      - "<gray>Create a new staff note</gray>"
      - ""
      - "<blue>Click to continue</blue>"
    note-name: "<white><bold>#<id></bold></white> <gray>·</gray> <aqua><type></aqua> <dark_gray>/</dark_gray> <gray><priority></gray>"
    note-critical-name: "<red><bold>#<id></bold></red> <gray>·</gray> <red><bold>CRITICAL</bold></red>"
    note-lore:
      - "<gray>By <white><staff></white></gray>"
      - "<gray><date></gray>"
      - ""
      - "<white><content></white>"
      - ""
      - "<blue>Click to view details</blue>"
    close-name: "<red><bold>Close</bold></red>"
    close-lore:
      - "<gray>Page <white><current></white> / <white><total></white></gray>"
      - ""
      - "<gray>Close this menu</gray>"
    filter-name: "<white><bold>Filter</bold></white>"
    filter-lore:
      - "<gray>Current: <white><filter></white></gray>"
      - ""
      - "<blue>Click to change</blue>"
    previous-enabled-name: "<white><bold>Previous Page</bold></white>"
    previous-enabled-lore:
      - "<gray>Page <white><current></white> / <white><total></white></gray>"
      - ""
      - "<blue>Go to previous page</blue>"
    previous-disabled-name: "<dark_gray><bold>Unavailable</bold></dark_gray>"
    previous-disabled-lore:
      - "<dark_gray>No previous page</dark_gray>"
    next-enabled-name: "<white><bold>Next Page</bold></white>"
    next-enabled-lore:
      - "<gray>Page <white><current></white> / <white><total></white></gray>"
      - ""
      - "<blue>Go to next page</blue>"
    next-disabled-name: "<dark_gray><bold>Unavailable</bold></dark_gray>"
    next-disabled-lore:
      - "<dark_gray>No next page</dark_gray>"

# Single note detail view (archive / delete actions)
detail-menu:
  title: "<gradient:#ffffff:#60a5fa><bold>Note Details</bold></gradient> <dark_gray>·</dark_gray> <gray>#<id></gray>"
  size: 27

  slots:
    info: 10
    archive: 12
    edit: 13
    delete: 14
    back: 16
    close: 22

  labels:
    info-name: "<white><bold>Note #<id></bold></white>"
    info-lore:
      - "<gray>Type: <white><type></white></gray>"
      - "<gray>Priority: <white><priority></white></gray>"
      - "<gray>By: <white><staff></white></gray>"
      - "<gray>Created: <white><date></white></gray>"
      - ""
      - "<white><content></white>"
    archive-name: "<gold><bold>Archive Note</bold></gold>"
    archive-lore:
      - "<gray>Hide this note from active list</gray>"
      - ""
      - "<yellow>Click to archive</yellow>"
    edit-name: "<gradient:#60a5fa:#93c5fd><bold>Edit Note</bold></gradient>"
    edit-lore:
      - "<gray>Update the content of this note</gray>"
      - ""
      - "<blue>Click to edit</blue>"
    delete-name: "<red><bold>Delete Note</bold></red>"
    delete-lore:
      - "<gray>Permanently remove this note</gray>"
      - ""
      - "<red>Click to delete</red>"
    back-name: "<aqua><bold>Back</bold></aqua>"
    back-lore:
      - "<gray>Return to player notes</gray>"
    close-name: "<red><bold>Close</bold></red>"
    close-lore:
      - "<gray>Close this menu</gray>"

