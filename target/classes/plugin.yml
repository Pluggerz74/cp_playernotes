name: cp_playernotes
version: '0.9.1-beta'
main: de.codingplugs.playernotes.PlayerNotesPlugin
api-version: '1.19'
description: Player notes for staff and administrators
authors:
  - CodingPlugs

softdepend:
  - PlaceholderAPI

commands:
  pn:
    description: PlayerNotes commands
    usage: /<command> <player|add|list|archive|remove|version|reload|debug|discordtest>

permissions:
  playernotes.use:
    description: Access /pn version
    default: true
  playernotes.view:
    description: View player notes
    default: op
  playernotes.add:
    description: Add player notes
    default: op
  playernotes.archive:
    description: Archive player notes
    default: op
  playernotes.remove:
    description: Permanently remove player notes
    default: op
  playernotes.reload:
    description: Reload plugin configuration
    default: op
  playernotes.notify:
    description: Receive join alerts for flagged players
    default: op
  playernotes.admin:
    description: Full PlayerNotes administration
    default: op
    children:
      playernotes.use: true
      playernotes.view: true
      playernotes.add: true
      playernotes.archive: true
      playernotes.remove: true
      playernotes.reload: true
      playernotes.notify: true
